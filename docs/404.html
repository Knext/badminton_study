<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없어요 · 배드민턴 복식 가이드</title>
<style>
  :root{--paper:#EDEFE8;--ink:#1C2621;--mat:#2F6B55}
  @media (prefers-color-scheme:dark){:root{--paper:#18201C;--ink:#E5EAE5;--mat:#2B624E}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
    font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:16px;text-align:center}
  a{display:inline-block;margin-top:12px;padding:10px 18px;border-radius:999px;background:var(--mat);color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>페이지를 찾을 수 없어요</h1>
  <p>주소가 바뀌었을 수 있습니다. 첫 화면에서 다시 찾아 주세요.</p>
  <!-- 저장소 하위 경로(/badminton_study/)에서도 동작하도록 상대 경로로 안내한다 -->
  <a id="home" href="./">첫 화면으로</a>
</main>
<script>
  (function () {
    var seg = location.pathname.split('/').filter(Boolean);
    var base = location.hostname.endsWith('github.io') && seg.length ? '/' + seg[0] + '/' : '/';
    document.getElementById('home').setAttribute('href', base);
  })();
</script>
</body>
</html>
